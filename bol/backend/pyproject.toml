[project]
name = "BOL-backend"
version = "0.1.0"
description = "BOL AI calling platform — API + agent worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    # Fernet symmetric encryption for Tool secret headers (app/services/crypto.py).
    # Already present transitively via python-jose[cryptography] above, but
    # declared explicitly per this file's own convention of naming what's
    # actually imported (see the aiohttp comment under [worker] below).
    "cryptography>=43",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "redis>=5.0",
    "mutagen>=1.47",
    # Presigned recording-playback URLs only (app/services/recordings.py) —
    # generate_presigned_url is a local computation, no network call, so the
    # sync client is fine to use from an async route.
    "boto3>=1.35",
    # Local ONNX embeddings for the knowledge-base tool (app/services/knowledge.py)
    # — no external API/key, keeps BOL's self-host story intact. Runs
    # on the API only, not the worker (see worker/tools.py: the worker calls
    # /internal/knowledge/search over HTTP like everything else it needs).
    "fastembed>=0.4",
    # Room creation, SIP dialing, and join/listen token generation
    # (app/services/livekit_service.py) run in the API process, not the
    # worker — this is a core dependency, not a worker-only one. Previously
    # under the `worker` extra below, which meant a clean install of just
    # the API's deps (no `[worker]` extra) couldn't import app.routers.calls
    # at all; this only went unnoticed because local dev installs both
    # extras into the same shared .venv, masking the gap. livekit-agents
    # itself (the full voice-pipeline framework) stays worker-only.
    "livekit-api>=0.8",
]

[project.optional-dependencies]
worker = [
    "livekit-agents>=1.0",
    "livekit-plugins-groq>=0.1",
    "livekit-plugins-silero>=0.7",
    "livekit-plugins-fishaudio>=1.6",
    # Bundles native dylibs and runs entirely on-device — no cloud API, no
    # extra cost, works the same on LiveKit Cloud or self-hosted.
    "livekit-plugins-noise-cancellation>=0.3",
    # Chatterbox is reached through its OpenAI-compatible /v1/audio/speech
    # endpoint — no dedicated plugin needed, livekit-plugins-openai is
    # already installed transitively via livekit-plugins-groq.
    # worker/chatterbox_tts.py imports this directly; currently resolves
    # transitively via livekit-agents, but that's not a contract — declare
    # what's actually imported.
    "aiohttp>=3.9",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]
